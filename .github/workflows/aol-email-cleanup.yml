name: AOL email cleanup

on:
  schedule:
    # every 4 hours (minute offset avoids GitHub's top-of-hour congestion)
    - cron: "23 */4 * * *"
  push:
    branches: ["claude/aol-email-cleanup-w6ro50"]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (report only) or run (move matching mail)"
        type: choice
        default: dry-run
        options: [dry-run, run]

permissions:
  contents: write

concurrency:
  group: aol-email-cleanup
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[deep-clean]')) && 350 || 25 }}
    # skip pushes made by the status-update step below
    if: ${{ !contains(github.event.head_commit.message, '[skip-clean]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        env:
          AOL_EMAIL: ${{ secrets.AOL_EMAIL }}
          AOL_APP_PASSWORD: ${{ secrets.AOL_APP_PASSWORD }}
        run: |
          if [ -z "$AOL_EMAIL" ] || [ -z "$AOL_APP_PASSWORD" ]; then
            echo "::error::Repository secrets AOL_EMAIL and AOL_APP_PASSWORD are not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Run cleaner
        env:
          AOL_ACCOUNT: ${{ secrets.AOL_EMAIL }}
          AOL_APP_PASSWORD: ${{ secrets.AOL_APP_PASSWORD }}
          AOL_CLEANER_DIR: ${{ github.workspace }}/aol-email-cleaner
          AOL_CLEANER_LOG: ${{ runner.temp }}/aol-email-cleaner.log
          AOL_CLEANER_ENABLED: "1"
          # public logs stay minimal (no senders/subjects); dry-run details
          # go to a short-lived artifact instead
          AOL_CLEANER_QUIET: "1"
          AOL_CLEANER_REPORT: ${{ runner.temp }}/dry-run-report.txt
          AOL_CLEANER_STATS: ${{ runner.temp }}/run-stats.json
          # [deep-clean] in a push's commit message = one-off real run over the last year
          AOL_CLEANER_LOOKBACK: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[deep-clean]')) && '365' || '30' }}
          # a push whose commit message contains [diag] adds content-rule
          # diagnostics for recent free-mail messages to the dry-run report
          AOL_CLEANER_DIAG: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[diag]') && '1' || '0' }}
          # [inventory] adds a catalog of unmatched inbox senders to the dry-run report
          AOL_CLEANER_INVENTORY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[inventory]') && '1' || '0' }}
          # schedule = real run; push = dry-run unless the commit message
          # says [real-run]; manual dispatch = whichever mode was chosen
          MODE: ${{ github.event_name == 'schedule' && 'run' || (github.event_name == 'push' && ((contains(github.event.head_commit.message, '[real-run]') || contains(github.event.head_commit.message, '[deep-clean]')) && 'run' || 'dry-run')) || inputs.mode }}
          HEAD_MSG: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
        run: |
          echo "mode: $MODE"
          # [search: term, term] in a push's commit message = dry-run lookup of
          # inbox mail whose From/Subject contains a term (report is encrypted)
          SEARCH_TERMS="$(printf '%s' "$HEAD_MSG" | grep -oP '\[search:\s*\K[^\]]+' | head -1 || true)"
          export AOL_CLEANER_SEARCH="$SEARCH_TERMS"
          python3 aol-email-cleaner/aol_email_cleaner.py "--$MODE"
          # dry-run: emit the report base64-encoded so the operator can
          # retrieve it from the job log without a plaintext public listing
          if [ "$MODE" = "dry-run" ] && [ -f "$AOL_CLEANER_REPORT" ]; then
            if [ -n "$SEARCH_TERMS" ] && [ -f aol-email-cleaner/report-public.pem ]; then
              # search results contain personal mail: encrypt to the operator's
              # public key (AES-256 for the body, RSA-OAEP for the AES key)
              KEYFILE="$RUNNER_TEMP/report.key"
              openssl rand -out "$KEYFILE" 32
              openssl enc -aes-256-cbc -pbkdf2 -salt -in "$AOL_CLEANER_REPORT" \
                -out "$RUNNER_TEMP/report.enc" -pass file:"$KEYFILE"
              openssl pkeyutl -encrypt -pubin -inkey aol-email-cleaner/report-public.pem \
                -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
                -in "$KEYFILE" -out "$RUNNER_TEMP/report.key.enc"
              rm -f "$KEYFILE" "$AOL_CLEANER_REPORT"
              echo "REPORT-KEY-BEGIN"; base64 -w0 "$RUNNER_TEMP/report.key.enc"; echo ""; echo "REPORT-KEY-END"
              echo "REPORT-ENC-BEGIN"; base64 -w0 "$RUNNER_TEMP/report.enc"; echo ""; echo "REPORT-ENC-END"
            else
              echo "REPORT-B64-BEGIN"
              base64 -w0 "$AOL_CLEANER_REPORT"
              echo ""
              echo "REPORT-B64-END"
            fi
          fi

      - name: Upload dry-run report (expires in 1 day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-report
          path: ${{ runner.temp }}/dry-run-report.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Update dashboard status
        # only real runs update the dashboard (scheduled, or [real-run] push)
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[real-run]') || contains(github.event.head_commit.message, '[deep-clean]')))) }}
        env:
          STATS_FILE: ${{ runner.temp }}/run-stats.json
        run: |
          python3 - << 'EOF'
          import json, os, sys
          stats_path = os.environ["STATS_FILE"]
          status_path = "aol-email-cleaner/status.json"
          try:
              stats = json.load(open(stats_path))
          except Exception:
              stats = {"time": None, "mode": "run", "ok": False,
                       "error": "run produced no stats (crashed early)"}
          try:
              status = json.load(open(status_path))
          except Exception:
              status = {}
          status.setdefault("total_moved", 0)
          status.setdefault("totals_by_rule", {})
          status.setdefault("history", [])
          status["last_run"] = stats.get("time")
          status["last_mode"] = stats.get("mode")
          status["last_ok"] = stats.get("ok", False)
          status["last_error"] = stats.get("error")
          status["last_scanned"] = stats.get("scanned", 0)
          status["last_moved"] = stats.get("moved", 0)
          status["total_moved"] += stats.get("moved", 0)
          for rule, n in (stats.get("by_rule") or {}).items():
              status["totals_by_rule"][rule] = status["totals_by_rule"].get(rule, 0) + n
          status["history"].append({
              "t": stats.get("time"), "moved": stats.get("moved", 0),
              "scanned": stats.get("scanned", 0), "ok": stats.get("ok", False)})
          status["history"] = status["history"][-90:]
          json.dump(status, open(status_path, "w"), indent=2)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aol-email-cleaner/status.json
          # status is bookkeeping: retry around concurrent pushes, and never
          # fail the run over it — the mail cleaning already succeeded
          git diff --cached --quiet || {
            git commit -m "Update cleaner status [skip-clean]"
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs || git rebase --abort
              sleep 3
            done || echo "::warning::status push failed after retries (bookkeeping only)"
          }
